# STAGED, NOT ACTIVE. This workflow is not running on GitHub: the push token lacks the `workflow` scope, so it lives
# here. To activate, a maintainer copies it to .github/workflows/tests.yml. Until then CI status = "staged".
name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: UI integrity sidecar matches the file bytes (R4-07)
        run: cd ui && sha256sum -c index.html.sha256
      - run: python tests/test_no_leaks.py
      - run: python tests/test_round9.py
      - run: python tests/test_round8.py
      - run: python tests/test_round7.py
      - run: python tests/test_round6.py
      - name: asset manifest (docs/assets-manifest.json) matches every tracked public asset
        run: python tools/build_asset_manifest.py && git diff --exit-code docs/assets-manifest.json
      - run: python tests/test_round5.py
      - run: python tests/test_round4.py
      - run: python tests/test_round3.py
      - run: python tests/test_replay.py
      - run: python tests/test_signals.py
      - name: private fixtures (prints SKIPPED in CI; real payloads are never committed)
        run: python tests/test_private_fixtures.py
      - name: all suites with totals and skips
        run: python tests/run_all.py
