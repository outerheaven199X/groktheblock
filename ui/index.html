<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptOSINT · Grok Bot</title>
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#07080a;--bg2:#0b0d10;--card:#0f1215;--line:#1b2027;--line2:#262c35;
  --ink:#ecebe6;--ink2:#a7abb2;--ink3:#6b717b;
  --org:#00e87b;--ins:#ff3b5c;--agent:#b06bff;--snip:#ffb020;--copy:#4fc3ff;--x:#8fa3ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:40px;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);z-index:0}
a{color:var(--copy);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}.dim{color:var(--ink2)}.faint{color:var(--ink3)}
/* shell */
.top{position:sticky;top:0;z-index:5;background:rgba(7,8,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);max-width:1360px;margin:auto}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.18em;font-size:13px;white-space:nowrap}.brand b{color:var(--org)}.brand i{font-style:normal;color:var(--ink3);font-weight:400}
.cmd{flex:1;min-width:240px;display:flex;align-items:center;gap:var(--s2);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;cursor:text}
.cmd:focus-within{border-color:var(--org);box-shadow:0 0 0 3px rgba(0,232,123,.12)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:13px var(--mono)}
.kbd{font:11px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 var(--s5);max-width:1360px;margin:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:10px 12px;font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab:hover{color:var(--ink2)}.tab.on{color:var(--ink);border-color:var(--org)}.tab sup{color:var(--ink3);margin-left:3px}
main{position:relative;z-index:1;max-width:1360px;margin:auto;padding:var(--s5)}
/* type */
.kicker{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
h1.hed{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,46px);line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.dek{font-family:var(--serif);font-size:18px;color:var(--ink2);max-width:72ch;margin:0 0 var(--s5)}
h2{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 var(--s3)}
/* layout */
.grid{display:grid;gap:var(--s4)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21{grid-template-columns:1fr}}
@media(max-width:640px){.g4,.g2{grid-template-columns:1fr}main{padding:var(--s4)}.bar{padding:var(--s3) var(--s4)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s4) var(--s4);position:relative;min-width:0}
.card+.card{margin-top:0}.stack>*+*{margin-top:var(--s4)}
.stat .v{font:600 28px/1.1 var(--mono);margin-top:6px;overflow-wrap:anywhere}.stat .s{color:var(--ink3);font-size:12px;margin-top:4px}
/* gauge */
.gauge{display:flex;align-items:center;gap:var(--s4)}.gauge svg{flex:none}.gauge .n{font:700 34px var(--mono)}
/* pills & classes */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.INSIDER{color:var(--ins)}.AGENT{color:var(--agent)}.SNIPER{color:var(--snip)}.COPY{color:var(--copy)}.ORGANIC{color:var(--org)}
.CRITICAL,.HIGH{color:var(--ins)}.MEDIUM{color:var(--snip)}.LOW{color:var(--org)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}.seg span{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s3);font:12px var(--mono)}
/* table */
.tw{overflow:auto;max-height:560px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--card);text-align:left;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:right;font-family:var(--mono);white-space:nowrap}tr:hover td{background:rgba(255,255,255,.02)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.chip{background:none;border:1px solid var(--line2);color:var(--ink2);border-radius:99px;padding:3px 10px;font:12px var(--mono);cursor:pointer}.chip.on{border-color:currentColor}
.callout{border-left:3px solid var(--snip);background:rgba(255,176,32,.06);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;color:var(--ink)}
.callout.bad{border-color:var(--ins);background:rgba(255,59,92,.06)}.callout.ok{border-color:var(--org);background:rgba(0,232,123,.05)}
/* graph */
.graph{width:100%;height:520px;display:block;border-radius:8px;background:radial-gradient(ellipse at center,#0d1116 0,#07080a 75%);cursor:grab}
.graph:active{cursor:grabbing}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:12px var(--mono);max-width:320px;z-index:20;display:none}
/* timeline */
.scrub{width:100%;accent-color:var(--org)}
.ev{display:grid;grid-template-columns:72px 120px 1fr;gap:var(--s3);padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;transition:opacity .15s}
.ev.future{opacity:.18}.ev .t{font-family:var(--mono);color:var(--ink3)}.ev .k{font:600 11px var(--mono);letter-spacing:.05em}
@media(max-width:640px){.ev{grid-template-columns:60px 1fr}.ev .k{grid-column:2}.ev .d{grid-column:1/3}}
/* states */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:var(--s6) var(--s5);text-align:center;color:var(--ink2)}
.empty h3{font-family:var(--serif);font-size:24px;margin:0 0 8px;color:var(--ink)}
.empty code,.code{font:12px var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--ink)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0,var(--line2) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.btn{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 12px;font:12px var(--mono);cursor:pointer}.btn:hover{border-color:var(--org)}
.foot{color:var(--ink3);font-size:12px;margin-top:var(--s5);border-top:1px solid var(--line);padding-top:var(--s3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:30}
.modal.on{display:flex}.sheet{background:var(--card);border:1px solid var(--line2);border-radius:14px;width:min(560px,92vw);padding:var(--s5)}
.sheet dl{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:0}.sheet dt{font-family:var(--mono)}
.res{max-height:280px;overflow:auto;margin-top:var(--s3)}.res div{padding:8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.res div.on,.res div:hover{background:var(--bg2)}
.drop:after{content:"Drop JSON to load";position:fixed;inset:12px;border:2px dashed var(--org);border-radius:16px;display:grid;place-items:center;font:600 20px var(--mono);color:var(--org);background:rgba(0,0,0,.6);z-index:40}
</style></head><body>
<div class="top"><div class="bar">
  <div class="brand">CRYPT<b>OSINT</b> <i>// grok bot</i></div>
  <label class="cmd" id="cmdbox"><span class="faint mono">›</span><input id="cmd" placeholder="Paste a $TICKER, token CA, or wallet…" autocomplete="off" spellcheck="false"><span class="kbd">/</span></label>
  <button class="btn" id="exp" title="Export current report (e)">Export</button>
  <button class="btn" id="help" title="Shortcuts (?)">?</button>
</div><nav class="tabs" id="tabs"></nav></div>
<main id="app"></main>
<div class="tip" id="tip"></div>
<div class="modal" id="palette"><div class="sheet"><div class="kicker">Command</div><div id="palbody"></div></div></div>
<div class="modal" id="keys"><div class="sheet"><div class="kicker" style="margin-bottom:12px">Keyboard</div><dl>
<dt>/ or ⌘K</dt><dd>Command bar</dd><dt>1 – 8</dt><dd>Switch view</dd><dt>[ ]</dt><dd>Previous / next report in this view</dd><dt>← →</dt><dd>Scrub the rug replay</dd><dt>space</dt><dd>Play / pause replay</dd><dt>e</dt><dd>Export (original envelope)</dd><dt>esc</dt><dd>Close</dd></dl></div></div>
<input type="file" id="pick" accept=".json" multiple hidden>
<script>
"use strict";
const VIEWS=[["scan","Token"],["shill","Shill net"],["copy","Copy net"],["wallet","Wallet"],["replay","Replay"],["board","Leaderboard"],["threats","Threats"],["prov","Provenance"]];
const COL={INSIDER:"#ff3b5c",AGENT:"#b06bff",SNIPER:"#ffb020",COPY:"#4fc3ff",ORGANIC:"#00e87b"};
const ORDER=["INSIDER","AGENT","SNIPER","COPY","ORGANIC"];
const S={withX:false,reports:[],view:"scan",idx:{},loading:true,scrub:null,playing:null,sort:{},filter:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sh=a=>a&&a.length>12?a.slice(0,4)+"…"+a.slice(-4):(a||"");
const fmt=(n,d=0)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:0});
const money=n=>n==null?"—":n>=1e9?"$"+(n/1e9).toFixed(2)+"B":n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+fmt(n);
const sol=n=>(n>0?"+":"")+fmt(n,3);
function kind(j){if(!j||typeof j!=="object")return null;if(j.result&&j.tool)return kind(j.result);if(j.organicScore!=null)return"scan";if(j.coordinationIndex!=null)return"shill";if(j.wallet&&j.tokens)return"wallet";if(j.timeline)return"replay";if(j.entries)return"board";if(j.results)return"prov";if(Array.isArray(j))return"threats";return null}
function add(name,j){if(j&&j.tool&&j.result)j=j.result;const k=kind(j);if(!k)return 0;S.reports=S.reports.filter(r=>r.name!==name);S.reports.push({name,k,j});return 1}
const list=k=>S.reports.filter(r=>r.k===k||(k==="copy"&&r.k==="scan"&&(r.j.copyNetwork||[]).length));
const cur=()=>{const l=list(S.view);return l[Math.min(S.idx[S.view]||0,l.length-1)]};
async function autoload(){for(const dir of["../out/","../examples/"]){try{const h=await(await fetch(dir)).text();const names=[...h.matchAll(/href="([^"]+\.json)"/g)].map(m=>decodeURIComponent(m[1]));
await Promise.all(names.map(async n=>{if(S.reports.some(r=>r.name===n))return;try{add(n,await(await fetch(dir+n)).json())}catch(e){}}))}catch(e){}}
S.loading=false;const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;else if(!list(S.view).length&&S.reports[0])S.view=S.reports[0].k;render()}
function tabs(){$("#tabs").innerHTML=VIEWS.map(([k,l],i)=>{const n=list(k).length;return`<button class="tab ${k===S.view?"on":""}" data-k="${k}" title="${i+1}">${l}${n?`<sup>${n}</sup>`:""}</button>`}).join("");
$("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.k))}
function go(k){S.view=k;history.replaceState(null,"","#"+k);stopPlay();S.scrub=null;render();scrollTo({top:0})}
function render(){tabs();const app=$("#app");
if(S.loading){app.innerHTML=`<div class="grid g4">${[1,2,3,4].map(()=>`<div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="height:30px;margin-top:12px"></div></div>`).join("")}</div><div class="card" style="margin-top:16px">${[90,80,95,70,85].map(w=>`<div class="skel" style="width:${w}%;margin:10px 0"></div>`).join("")}</div>`;return}
const r=cur();if(!r){app.innerHTML=empty(S.view);return}
const l=list(S.view);const pager=l.length>1?`<div class="filters" style="margin:0 0 16px">${l.map((x,i)=>`<button class="chip ${x===r?"on":""}" data-i="${i}" style="color:${x===r?"var(--org)":""}">${esc(label(x))}</button>`).join("")}</div>`:"";
app.innerHTML=pager+V[S.view](r.j,r);app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.idx[S.view]=+b.dataset.i;S.scrub=null;render()});
(after[S.view]||(()=>{}))(r.j,r)}
function label(r){const j=r.j;return j.token?("$"+j.token.symbol):j.ticker?j.ticker:j.wallet?sh(j.wallet.address):j.type?j.type:r.name}
function empty(k){const cmd={scan:"skills/token-scan/scripts/token_scan.py <mint>",shill:"skills/shill-network/scripts/shill_network.py '$TICKER' out/x-TICKER",copy:"skills/copy-network/scripts/copy_network.py out/scan-….json",wallet:"skills/wallet-scan/scripts/wallet_scan.py <wallet>",replay:"skills/rug-replay/scripts/rug_replay.py <mint> --x-posts out/x-TICKER",board:"skills/leaderboard/scripts/leaderboard.py --type SNIPER",threats:"skills/threat-feed/scripts/threat_feed.py",prov:"skills/promo-provenance/scripts/provenance.py <files>"}[k];
return`<div class="empty"><div class="kicker">Nothing loaded</div><h3>No ${VIEWS.find(v=>v[0]===k)[1].toLowerCase()} reports yet</h3><p>Ask your Grok Bot, or run <code>.venv/bin/python ${esc(cmd)}</code>.<br>Reports in <code>out/</code> and <code>examples/</code> load automatically when you serve the repo (<code>python3 -m http.server</code>, open <code>/ui/</code>).</p><button class="btn" onclick="document.getElementById('pick').click()">Open JSON…</button> <span class="faint">or drop files anywhere</span></div>`}
function gauge(v,lab,c){const R=38,C=2*Math.PI*R*0.75,o=C*(1-Math.max(0,Math.min(100,v))/100);
return`<div class="gauge"><svg width="96" height="96" viewBox="0 0 96 96"><g transform="rotate(135 48 48)"><circle cx="48" cy="48" r="${R}" fill="none" stroke="#1b2027" stroke-width="8" stroke-dasharray="${C} 999" stroke-linecap="round"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-dasharray="${C} 999" stroke-dashoffset="${o}" stroke-linecap="round" style="transition:stroke-dashoffset .6s"/></g></svg><div><div class="n" style="color:${c}">${fmt(v)}</div><div class="kicker">${lab}</div></div></div>`}
const scoreCol=v=>v<40?COL.INSIDER:v<65?COL.SNIPER:COL.ORGANIC;
const sevCol={CRITICAL:COL.INSIDER,HIGH:COL.INSIDER,MEDIUM:COL.SNIPER,LOW:COL.ORGANIC};
function sortable(id,cols,rows,def){const st=S.sort[id]||def;const sorted=[...rows].sort((a,b)=>{const x=a[st.c],y=b[st.c];return(typeof x==="number"?x-y:String(x).localeCompare(String(y)))*st.d});
return`<div class="tw"><table data-tbl="${id}"><tr>${cols.map((c,i)=>`<th data-c="${i}">${c}${st.c===i?(st.d>0?" ↑":" ↓"):""}</th>`).join("")}</tr>${sorted.map(r=>`<tr>${r._html}</tr>`).join("")}</table></div>`}
function bindSort(){document.querySelectorAll("[data-tbl]").forEach(t=>t.querySelectorAll("th").forEach(th=>th.onclick=()=>{const id=t.dataset.tbl,c=+th.dataset.c,st=S.sort[id]||{c:-1,d:1};S.sort[id]={c,d:st.c===c?-st.d:-1};render()}))}
const V={
scan(j){const t=j.token,c=j.counts,tot=ORDER.reduce((a,k)=>a+c[k],0)||1,lp=j.lpMonitor||{},rc=lp.rugcheck||{},b=j.bundleSignal||{},sw=j.scanWindow||{};
const flt=S.filter.scan||"ALL";const ws=j.wallets.filter(w=>flt==="ALL"||w.type===flt);
const rows=ws.map(w=>Object.assign([ORDER.indexOf(w.type),w.address,w.entryBlock,w.txCount,w.supplyPercent,w.solFlowEstimate??0,w.tag||""],{_html:`<td><span class="pill ${w.type}">${w.type}</span></td><td class="mono"><a href="https://solscan.io/account/${w.address}" target="_blank" rel="noopener">${sh(w.address)}</a>${w.isDeployer?' <span class="pill" style="color:var(--ink)">DEV</span>':""}</td><td class="n">${w.entryBlock}</td><td class="n">${w.txCount}</td><td class="n">${fmt(w.supplyPercent,2)}%</td><td class="n" style="color:${(w.solFlowEstimate||0)>=0?"var(--org)":"var(--ins)"}">${sol(w.solFlowEstimate||0)}</td><td class="faint" style="font-size:12px">${esc(w.tag||"")}</td>`}));
const bundleBad=b.valid&&(b.severity==="CRITICAL"||b.severity==="HIGH");
return`<div class="kicker">Token scan · ${esc(sw.dataSource||"")} · ${fmt(sw.transactionsAnalyzed)} txs from ${sw.reachedLaunch?"launch":"oldest reachable"}</div>
<h1 class="hed">$${esc(t.symbol)} <span class="faint" style="font-weight:400">${esc(t.name)}</span></h1>
<p class="dek">${esc(j.verdict.summary)}</p>
<div class="grid g4"><div class="card">${gauge(j.organicScore,"Organic score",scoreCol(j.organicScore))}</div>
<div class="card stat"><div class="kicker">Verdict</div><div class="v ${j.verdict.severity}">${j.verdict.severity}</div><div class="s">${j.verdict.escalatedBy?`raised from ${esc(j.verdict.originalSeverity)} by bundle signal`:"original classifier"}</div></div>
<div class="card stat"><div class="kicker">Bundle signal</div><div class="v ${b.severity||""}">${b.valid?fmt(b.block0SupplyBoughtPct,1)+"%":"—"}</div><div class="s">${b.valid?`${b.block0Buyers} wallets in the launch slot`:"launch not reached"}</div></div>
<div class="card stat"><div class="kicker">Market cap · age</div><div class="v">${money(t.mcap)}</div><div class="s">${esc(t.age)} · ${fmt(t.totalHolders)} wallets in window</div></div></div>
${bundleBad&&!j.verdict.escalatedBy?`<div class="callout bad" style="margin-top:16px">The classifier says ${j.verdict.severity}, but ${b.block0Buyers} wallets took ${fmt(b.block0SupplyBoughtPct,1)}% of supply in the launch slot. Weigh the bundle signal.</div>`:""}
${!sw.reachedLaunch?`<div class="callout" style="margin-top:16px">Launch not reached on this data source. Early-block labels (INSIDER, SNIPER) are unreliable. Add a Helius key.</div>`:""}
<div class="grid g21" style="margin-top:16px"><div class="card"><h2>Wallet classes</h2><div class="seg">${ORDER.map(k=>c[k]?`<span style="flex:${c[k]};background:${COL[k]}" title="${k} ${c[k]}"></span>`:"").join("")}</div>
<div class="legend">${ORDER.map(k=>`<span><span class="dot" style="color:${COL[k]}"></span> ${k} <b>${c[k]}</b> <span class="faint">${fmt(100*c[k]/tot)}%</span></span>`).join("")}</div></div>
<div class="card"><h2>LP monitor</h2><div class="grid g2" style="gap:10px">
<div><div class="kicker">Liquidity</div><div class="mono">${money(lp.totalLiquidityUsd)}</div></div><div><div class="kicker">Pools</div><div class="mono">${(lp.pools||[]).length} · ${esc((lp.pools||[])[0]?.dex||"")}</div></div>
<div><div class="kicker">Mint auth</div><div class="mono ${rc.mintAuthority?"INSIDER":"ORGANIC"}">${rc.mintAuthority?"ENABLED":"revoked"}</div></div><div><div class="kicker">Freeze auth</div><div class="mono ${rc.freezeAuthority?"INSIDER":"ORGANIC"}">${rc.freezeAuthority?"ENABLED":"revoked"}</div></div>
<div><div class="kicker">LP locked</div><div class="mono">${(rc.markets||[]).length?fmt(rc.markets[0].lpLockedPct,1)+"%":"—"}</div></div><div><div class="kicker">RugCheck</div><div class="mono">${rc.scoreNormalised??"—"}</div></div></div>

$("#palette").classList.add("on");$("#palbody").querySelectorAll("[data-n]").forEach(d=>d.onclick=()=>{const r=S.reports.find(x=>x.name===d.dataset.n);closeAll();S.view=r.k;S.idx[r.k]=list(r.k).indexOf(r);render()});
$("#palbody").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);b.textContent="Copied"})}
function closeAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("on"))}
$("#cmd").addEventListener("keydown",e=>{if(e.key==="Enter"){palette(e.target.value);e.target.blur()}if(e.key==="Escape")e.target.blur()});
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)closeAll()});
$("#help").onclick=()=>$("#keys").classList.add("on");
function exportCur(){const r=cur();if(!r)return;const env={tool:"CryptOSINT",version:"0.3-grokbot",exportedAt:new Date().toISOString(),scanType:{scan:"token",wallet:"wallet",replay:"replay",shill:"shill"}[r.k]||r.k,result:r.j};
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(env,null,2)],{type:"application/json"}));a.download=`cryptosint-${env.scanType}-${label(r).replace(/[^a-zA-Z0-9_-]/g,"")}-${Date.now()}.json`;a.click()}
$("#exp").onclick=exportCur;
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=="range";
if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#cmd").focus();return}if(e.key==="Escape"){closeAll();return}if(typing)return;
if(e.key==="/"){e.preventDefault();$("#cmd").focus()}else if(e.key==="?")$("#keys").classList.add("on");else if(/^[1-8]$/.test(e.key))go(VIEWS[+e.key-1][0]);
else if(e.key==="e")exportCur();else if(e.key==="]"||e.key==="["){const n=list(S.view).length;if(n){S.idx[S.view]=((S.idx[S.view]||0)+(e.key==="]"?1:-1)+n)%n;S.scrub=null;render()}}
else if(S.view==="replay"&&$("#scrub")){const sc=$("#scrub"),st=1;if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();sc.value=+sc.value+(e.key==="ArrowRight"?st:-st);sc.oninput({target:sc})}if(e.key===" "){e.preventDefault();$("#play").click()}}});
document.addEventListener("click",e=>{const f=e.target.closest("[data-f]");if(f){S.filter.scan=f.dataset.f;render()}});
async function readFiles(fs){let k=null;for(const f of fs){try{const j=JSON.parse(await f.text());if(add(f.name,j))k=kind(j.result||j)}catch(e){}}S.loading=false;if(k){S.view=k;S.idx[k]=list(k).length-1}render()}
$("#pick").onchange=e=>readFiles(e.target.files);
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("drop")});addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("drop")});
addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("drop");readFiles(e.dataTransfer.files)});
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(render,200)});
render();autoload();
</script></body></html>
